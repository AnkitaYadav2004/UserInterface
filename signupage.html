<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="bg-gradient-to-r from-pink-100 to-pink-300 min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
          <h2 class="text-3xl font-bold text-pink-600 text-center mb-6">Create Account</h2>
          <form class="space-y-4">
            <div>
              <label class="block text-gray-700 font-medium mb-1">Full Name</label>
              <input type="text" placeholder="John Doe" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400" />
            </div>
            <div>
              <label class="block text-gray-700 font-medium mb-1">Email</label>
              <input type="email" placeholder="email@example.com" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400" />
            </div>
            <div>
              <label class="block text-gray-700 font-medium mb-1">Password</label>
              <input type="password" placeholder="********" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400" />
            </div>
           <a href="index2.html">
            <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold rounded-lg px-4 py-2 transition duration-300">
                Sign Up
              </button>
           </a>
            <p class="text-center text-sm text-gray-600 mt-4">
              Already have an account?
              <a href="loginpage.html" class="text-pink-500 font-medium hover:underline">Sign In</a>
            </p>
          </form>
        </div>
      </div>
</body>

</html>
